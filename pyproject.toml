[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "seer-oracle-replay"
version = "0.1.0"
description = "Reproducible teacher-trace resource accounting and oracle scheduling for Project Seer"
requires-python = ">=3.10"
dependencies = ["numpy==2.2.6", "matplotlib==3.10.9", "huggingface_hub==1.26.0"]
[project.scripts]
seer-replay = "seer_replay.__main__:main"
seer-download = "seer_replay.download:main"
[tool.setuptools.packages.find]
where = ["src"]
